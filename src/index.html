<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Resume Maker</title>
    <style>
      :root {
        --bg-deep: #070b1a;
        --bg-mid: #111a35;
        --text-main: #eaf2ff;
        --text-soft: #b9c8e6;
        --border-soft: rgba(155, 178, 220, 0.24);
        --panel-glass: rgba(10, 20, 45, 0.62);
        --focus-ring: rgba(99, 102, 241, 0.35);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(circle at 10% 10%, rgba(88, 28, 255, 0.55) 0%, transparent 34%),
          radial-gradient(circle at 90% 18%, rgba(6, 182, 212, 0.5) 0%, transparent 32%),
          radial-gradient(circle at 85% 85%, rgba(236, 72, 153, 0.35) 0%, transparent 25%),
          linear-gradient(145deg, var(--bg-deep) 0%, #0b1329 45%, var(--bg-mid) 100%);
        min-height: 100vh;
        color: var(--text-main);
        overflow-x: hidden;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(120deg, rgba(99, 102, 241, 0.08), rgba(6, 182, 212, 0.07));
        animation: glowShift 14s ease-in-out infinite alternate;
      }
      @keyframes glowShift {
        from {
          opacity: 0.55;
          transform: translateY(0px);
        }
        to {
          opacity: 0.95;
          transform: translateY(-10px);
        }
      }
      .wrapper {
        max-width: 1080px;
        margin: 0 auto;
        padding: 30px 18px 44px;
        position: relative;
        z-index: 1;
      }
      .hero {
        text-align: center;
        margin-bottom: 22px;
        animation: fadeUp 0.65s ease-out;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 3.2vw, 2.5rem);
        letter-spacing: 0.3px;
        background: linear-gradient(90deg, #dbeafe, #93c5fd 45%, #67e8f9 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .subtitle {
        margin-top: 8px;
        color: var(--text-soft);
      }
      .panel {
        background: var(--panel-glass);
        border: 1px solid var(--border-soft);
        border-radius: 20px;
        backdrop-filter: blur(14px);
        box-shadow: 0 18px 45px rgba(2, 6, 23, 0.48), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        transition: transform 0.2s ease, box-shadow 0.25s ease;
      }
      .panel:hover {
        transform: translateY(-1px);
        box-shadow: 0 22px 52px rgba(2, 6, 23, 0.52), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
      .form-panel {
        padding: 22px;
        animation: fadeUp 0.75s ease-out;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 15px;
      }
      .full {
        grid-column: 1 / -1;
      }
      .field {
        background: rgba(14, 27, 57, 0.46);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 14px;
        padding: 11px;
        transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
      }
      .field:focus-within {
        border-color: rgba(96, 165, 250, 0.6);
        background: rgba(19, 35, 73, 0.62);
        transform: translateY(-1px);
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.3px;
        color: #cce4ff;
        margin-bottom: 6px;
      }
      input,
      textarea {
        width: 100%;
        padding: 10px 11px;
        border-radius: 10px;
        border: 1px solid rgba(165, 186, 223, 0.32);
        background: rgba(8, 17, 38, 0.56);
        color: var(--text-main);
        font: inherit;
        outline: none;
        transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.2s ease;
      }
      input::placeholder,
      textarea::placeholder {
        color: #8fa3c8;
      }
      input:focus,
      textarea:focus {
        border-color: #7dd3fc;
        background: rgba(8, 17, 38, 0.75);
        box-shadow: 0 0 0 4px var(--focus-ring);
      }
      textarea {
        min-height: 100px;
        resize: vertical;
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 6px;
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 11px 14px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.18s ease, filter 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.38);
      }
      button:hover {
        transform: translateY(-2px);
        filter: brightness(1.05);
      }
      button:active {
        transform: translateY(0);
      }
      button:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }
      button[type="submit"] {
        background: linear-gradient(135deg, #6366f1, #22d3ee);
        color: white;
      }
      #copy-btn {
        background: linear-gradient(135deg, #10b981, #22c55e);
        color: white;
      }
      #download-btn {
        background: linear-gradient(135deg, #fb7185, #f97316);
        color: white;
      }
      .downloads {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin-top: 10px;
      }
      .download-btn {
        background: linear-gradient(135deg, #7c3aed, #a855f7 60%, #ec4899);
        color: white;
      }
      .status {
        margin-top: 14px;
        color: #dbeafe;
        font-size: 14px;
        min-height: 20px;
        padding-left: 3px;
        transition: color 0.2s ease;
      }
      .output-panel {
        margin-top: 16px;
        padding: 20px;
        animation: fadeUp 0.9s ease-out;
      }
      .output-title {
        margin: 0 0 10px;
        color: #bfdbfe;
        font-size: 1rem;
      }
      #output {
        margin: 0;
        white-space: pre-wrap;
        line-height: 1.55;
        background: rgba(6, 14, 34, 0.62);
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 12px;
        padding: 16px;
        min-height: 220px;
        color: #eef4ff;
        box-shadow: inset 0 0 0 1px rgba(96, 165, 250, 0.08);
      }
      .status.loading {
        color: #7dd3fc;
      }
      .status.success {
        color: #86efac;
      }
      .status.error {
        color: #fca5a5;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (max-width: 800px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .actions {
          flex-direction: column;
        }
        .downloads {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="hero">
        <h1>AI Resume Maker</h1>
        <p class="subtitle">Create a colorful, polished ATS-friendly resume in seconds.</p>
      </div>

      <div class="panel form-panel">
        <form id="resume-form" class="grid">
          <div class="field">
            <label for="fullName">Full Name *</label>
            <input id="fullName" name="fullName" required placeholder="e.g. Arnab Das" />
          </div>
          <div class="field">
            <label for="targetRole">Target Role *</label>
            <input id="targetRole" name="targetRole" required placeholder="e.g. Python Developer" />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" placeholder="you@example.com" />
          </div>
          <div class="field">
            <label for="phone">Phone</label>
            <input id="phone" name="phone" placeholder="+91 98xxxxxx" />
          </div>
          <div class="field">
            <label for="location">Location</label>
            <input id="location" name="location" placeholder="Kolkata, India" />
          </div>
          <div class="field">
            <label for="linkedin">LinkedIn URL</label>
            <input id="linkedin" name="linkedin" placeholder="https://linkedin.com/in/..." />
          </div>
          <div class="field full">
            <label for="portfolio">Portfolio / GitHub URL</label>
            <input id="portfolio" name="portfolio" placeholder="https://github.com/..." />
          </div>
          <div class="field full">
            <label for="summary">Professional Summary</label>
            <textarea id="summary" name="summary" placeholder="2-4 lines about your background and strengths."></textarea>
          </div>
          <div class="field full">
            <label for="skills">Skills (comma-separated)</label>
            <textarea id="skills" name="skills" placeholder="Python, Flask, SQL, REST API, Problem Solving"></textarea>
          </div>
          <div class="field full">
            <label for="experience">Work Experience</label>
            <textarea id="experience" name="experience" placeholder="Role, company, timeline, and impact bullets with metrics."></textarea>
          </div>
          <div class="field full">
            <label for="projects">Projects</label>
            <textarea id="projects" name="projects" placeholder="Project name, stack, key features, measurable outcomes."></textarea>
          </div>
          <div class="field full">
            <label for="education">Education</label>
            <textarea id="education" name="education" placeholder="Degree, institution, year, and notable achievements."></textarea>
          </div>
          <div class="field full">
            <label for="certifications">Certifications</label>
            <textarea id="certifications" name="certifications" placeholder="Relevant certifications and issuing organizations."></textarea>
          </div>
          <div class="full actions">
            <button type="submit">Generate Resume</button>
            <button type="button" id="copy-btn">Copy</button>
            <button type="button" id="download-btn">Download .txt</button>
          </div>
          <div class="full downloads">
            <button type="button" class="download-btn" data-format="pdf">Download PDF</button>
            <button type="button" class="download-btn" data-format="docx">Download DOCX</button>
            <button type="button" class="download-btn" data-format="jpg">Download JPG</button>
            <button type="button" class="download-btn" data-format="png">Download PNG</button>
          </div>
        </form>
      </div>

      <div class="status" id="status">Fill details and click Generate Resume.</div>

      <div class="panel output-panel">
        <h2 class="output-title">Generated Resume</h2>
        <pre id="output"></pre>
      </div>
    </div>

    <script>
      const form = document.getElementById("resume-form");
      const output = document.getElementById("output");
      const status = document.getElementById("status");
      const copyBtn = document.getElementById("copy-btn");
      const downloadBtn = document.getElementById("download-btn");
      const richDownloadBtns = document.querySelectorAll(".download-btn");

      function formToJson(formEl) {
        const data = new FormData(formEl);
        return Object.fromEntries(data.entries());
      }

      function setStatus(message, state = "") {
        status.className = "status";
        if (state) status.classList.add(state);
        status.textContent = message;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        setStatus("Generating...", "loading");
        output.textContent = "";
        const submitBtn = form.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.textContent = "Generating...";

        try {
          const payload = formToJson(form);
          const response = await fetch("/api/generate-resume", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.error || "Failed to generate resume.");
          }

          output.textContent = result.resume || "";
          setStatus(
            result.source === "gemini"
              ? "Generated with Gemini API."
              : "Generated using local fallback template (set GEMINI_API_KEY for AI output).",
            "success"
          );
        } catch (err) {
          setStatus(err.message, "error");
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Generate Resume";
        }
      });

      copyBtn.addEventListener("click", async () => {
        if (!output.textContent.trim()) {
          setStatus("Nothing to copy yet.", "error");
          return;
        }
        await navigator.clipboard.writeText(output.textContent);
        setStatus("Resume copied to clipboard.", "success");
      });

      downloadBtn.addEventListener("click", () => {
        if (!output.textContent.trim()) {
          setStatus("Nothing to download yet.", "error");
          return;
        }
        const blob = new Blob([output.textContent], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "resume.txt";
        link.click();
        URL.revokeObjectURL(url);
        setStatus("Downloaded resume.txt", "success");
      });

      async function downloadRichFormat(format) {
        if (!output.textContent.trim()) {
          setStatus("Nothing to download yet.", "error");
          return;
        }

        try {
          setStatus(`Preparing ${format.toUpperCase()}...`, "loading");
          const response = await fetch("/api/download-resume", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              resume: output.textContent,
              format,
              fileName: (document.getElementById("fullName").value || "resume").trim(),
            }),
          });

          if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.error || `Failed to download ${format}.`);
          }

          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = `resume.${format}`;
          link.click();
          URL.revokeObjectURL(url);
          setStatus(`Downloaded ${format.toUpperCase()} file.`, "success");
        } catch (err) {
          setStatus(err.message, "error");
        }
      }

      richDownloadBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          downloadRichFormat(btn.dataset.format);
        });
      });
    </script>
  </body>
</html>
